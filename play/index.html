<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>DUNDETT — Play in Browser</title>
    <meta name="description" content="Play DUNDETT directly in your browser. A text adventure about a missing boy, a grue, and a door behind the altar.">
    <meta name="robots" content="noindex, follow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            color: #3aff3a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            background: repeating-linear-gradient(0deg, rgba(0,255,0,0.04) 0px, rgba(0,255,0,0.04) 3px, transparent 3px, transparent 6px);
            animation: scanMove 0.2s linear infinite;
        }
        @keyframes scanMove { 0% { transform: translateY(0); } 100% { transform: translateY(6px); } }
        .crt-line {
            position: fixed;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(58,255,58,0.3);
            z-index: 1000;
            pointer-events: none;
            animation: crtRoll 8s linear infinite;
        }
        @keyframes crtRoll { 0% { top: -10%; } 100% { top: 110%; } }
        .game-container {
            background: #1a1a1a;
            border: 4px solid #3a3a3a;
            border-radius: 14px;
            padding: 20px;
            max-width: 750px;
            width: 100%;
            box-shadow: 0 0 60px rgba(58,255,58,0.08), inset 0 0 30px rgba(58,255,58,0.02);
            position: relative;
            z-index: 1001;
        }
        .brand {
            text-align: center;
            color: #4a6a4a;
            font-size: 9px;
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-transform: uppercase;
            opacity: 0.6;
        }
        .brand span { color: #3aff3a; opacity: 1; }
        .screen {
            background: #0a1a0a;
            border: 2px solid #1a3a1a;
            border-radius: 4px;
            padding: 24px;
            min-height: 350px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8), inset 0 0 80px rgba(0,20,0,0.4);
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        .screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0,10,0,0.3) 100%);
            pointer-events: none;
            border-radius: 4px;
            z-index: 1;
        }
        .menu.hidden { opacity: 0; transition: opacity 0.3s ease; }
        .menu.visible { opacity: 1; transition: opacity 0.3s ease; }
        .menu { transition: opacity 0.3s ease; }
        .location-name {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 18px;
            letter-spacing: 3px;
            color: #3aff3a;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(58,255,58,0.15);
            position: relative;
            z-index: 2;
        }
        .location-name::after {
            content: '';
            display: block;
            width: 60px;
            height: 1px;
            background: #2a4a2a;
            margin: 10px auto 0;
        }
        .description {
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 24px;
            color: #6aff6a;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            padding: 4px 0;
            position: relative;
            min-height: 80px;
            z-index: 2;
        }
        .menu { display: flex; flex-direction: column; gap: 6px; opacity: 1; transition: opacity 0.24s ease-in; z-index: 2; position: relative; }
        .menu.hidden { opacity: 0; pointer-events: none; }
        .menu.visible { opacity: 1; pointer-events: auto; }
        .menu-btn {
            background: #0f1f0f;
            border: 1px solid #1a3a1a;
            color: #3aff3a;
            padding: 10px 16px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: left;
            position: relative;
            opacity: 0.9;
            z-index: 2;
        }
        .menu-btn::before {
            content: '>';
            color: #2a5a2a;
            margin-right: 12px;
            font-weight: bold;
        }
        .menu-btn:hover {
            background: #1a2f1a;
            border-color: #3aff3a;
            box-shadow: 0 0 20px rgba(58,255,58,0.08);
            opacity: 1;
        }
        .menu-btn:hover::before { color: #3aff3a; }
        .menu-btn:active { transform: scale(0.98); }
        .warning {
            text-align: center;
            font-size: 7px;
            color: #2a4a2a;
            margin-top: 12px;
            font-style: italic;
            letter-spacing: 2px;
            opacity: 0.5;
            z-index: 2;
            position: relative;
            transition: all 0.3s ease;
        }
        @media (max-width: 600px) {
            .game-container { padding: 14px; }
            .screen { padding: 16px; min-height: 280px; }
            .location-name { font-size: 16px; }
            .description { font-size: 11px; }
            .menu-btn { padding: 8px 12px; font-size: 11px; }
            .menu-btn::before { margin-right: 8px; }
        }

        /* ===== CORRUPTION EFFECTS ===== */
        body.corrupted .scanlines {
            animation-duration: 0.05s !important;
            opacity: 0.8 !important;
        }

        body.corrupted .crt-line {
            animation-duration: 2s !important;
        }

        body.corrupted .location-name {
            animation: textGlitch 0.5s infinite;
        }

        body.corrupted .description {
            animation: textGlitch 0.7s infinite;
        }

        body.corrupted .screen {
            animation: screenShake 0.1s infinite alternate;
        }

        body.corrupted .screen::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(58,255,58,0.2);
            z-index: 3;
            pointer-events: none;
            animation: tear 0.3s infinite alternate;
        }

        @keyframes textGlitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 1px); }
            40% { transform: translate(2px, -1px); }
            60% { transform: translate(-1px, -1px); }
            80% { transform: translate(1px, 2px); }
        }

        @keyframes screenShake {
            0% { transform: translate(0, 0); }
            100% { transform: translate(1px, -1px); }
        }

        @keyframes tear {
            0% { top: 10%; }
            25% { top: 30%; }
            50% { top: 50%; }
            75% { top: 70%; }
            100% { top: 90%; }
        }

        body.corrupted .menu-btn {
            animation: btnGlitch 1s infinite;
        }

        @keyframes btnGlitch {
            0%, 90%, 100% { border-color: #2a4a2a; }
            92% { border-color: #ff3a3a; }
            94% { border-color: #3aff3a; }
            96% { border-color: #2a4a2a; }
        }

        body.corrupted-high .screen {
            animation: screenShake 0.05s infinite alternate;
        }

        body.corrupted-high .location-name {
            animation: textGlitch 0.2s infinite;
        }

        body.corrupted-high .description {
            animation: textGlitch 0.3s infinite;
        }

        body.corrupted-high .scanlines {
            animation-duration: 0.02s !important;
            opacity: 0.9 !important;
        }

        /* Ghost text overlay */
        .ghost-text {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            color: rgba(58,255,58,0.05);
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            padding: 24px;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        body.corrupted .ghost-text {
            opacity: 1;
        }

        body.corrupted-high .ghost-text {
            opacity: 0.7;
        }
    </style>
</head>
<body>
<div class="scanlines"></div>
<div class="crt-line"></div>

<div class="game-container">
    <div class="brand">TI-84 Plus CE <span>▸</span> DUNDETT WEB EDITION</div>
    <div class="screen">
        <div class="ghost-text" id="ghostText"></div>
        <div class="location-name" id="locationName">LOADING...</div>
        <div class="description" id="description">Initializing DUNDETT...</div>
        <div class="menu" id="menu"></div>
    </div>
    <div class="warning">✦ THE GRUE IS WAITING IN THE DARK ✦</div>
</div>

<script>
// DUNDETT Web Edition — Pure JavaScript
// Matches TI-BASIC v1.3.5 source code exactly

// ===== LOCALSTORAGE SAVES =====
function loadSave() {
    try {
        const save = JSON.parse(localStorage.getItem('dundett_save'));
        if (save) {
            return save;
        }
    } catch(e) {}
    return null;
}

function saveGame() {
    try {
        localStorage.setItem('dundett_save', JSON.stringify({
            sanity: L2[0],
            deaths: L2[1],
            z: Z,
            fun: F,
            safeCode: P,
            l1: L1
        }));
    } catch(e) {}
}

// ===== GAME STATE =====
let L1 = new Array(25).fill(0);
let L2 = [0, 0];
let Z = 0;
let F = 0;
let P = 0;
let currentLocation = "mainMenu";
let typingInterval = null;
let pendingLocation = null;
let previousDescription = "";
let ghostTextInterval = null;

const Str1 = "YOU HEAR BREATHING.";
const Str2 = "THE GRUE IS CLOSE.";
const Str3 = "SOMETHING MOVES.";
const Str4 = "YOU SEE SOMETHING MOVE.";
let Str9 = "";

// ===== CORRUPTION GLITCH WORDS =====
const glitchWords = {
    "DOOR": "VOID",
    "KEY": "BLOOD",
    "LIGHT": "DARK",
    "YOU": "IT",
    "ROAD": "RIFT",
    "BEAR": "SHADOW",
    "GRUE": "???",
    "SMITH": "THEY",
    "THOMAS": "YOU",
    "MOTHER": "ECHO",
    "FATHER": "STATIC"
};

function applyGlitchWords(text) {
    if (L2[0] < 7) return text;
    const words = Object.keys(glitchWords);
    const glitchChance = Math.min(0.3, (L2[0] - 6) * 0.05);
    return text.split(' ').map(word => {
        const clean = word.replace(/[^a-zA-Z]/g, '');
        if (clean.length > 2 && Math.random() < glitchChance) {
            const replacement = glitchWords[clean.toUpperCase()];
            if (replacement) {
                return word.replace(clean, replacement);
            }
        }
        return word;
    }).join(' ');
}

// ===== MAIN MENU =====
function showMainMenu() {
    currentLocation = "mainMenu";
    document.getElementById('locationName').textContent = "D U N D E T T";
    document.getElementById('description').textContent = "VERSION 1.3.5\nA TEXT ADVENTURE\nBASED ON DUNNET";
    const menuDiv = document.getElementById('menu');
    menuDiv.innerHTML = '';
    const btn1 = document.createElement('button');
    btn1.className = 'menu-btn';
    btn1.textContent = "BEGIN ADVENTURE";
    btn1.onclick = () => { startGame(); };
    menuDiv.appendChild(btn1);
    const btn2 = document.createElement('button');
    btn2.className = 'menu-btn';
    btn2.textContent = "HELP";
    btn2.onclick = () => { showHelp(); };
    menuDiv.appendChild(btn2);
    const btn3 = document.createElement('button');
    btn3.className = 'menu-btn';
    btn3.textContent = "CHANGELOG";
    btn3.onclick = () => { showChangelog(); };
    menuDiv.appendChild(btn3);
    const btn4 = document.createElement('button');
    btn4.className = 'menu-btn';
    btn4.textContent = "QUIT";
    btn4.onclick = () => { showQuit(); };
    menuDiv.appendChild(btn4);
    updateCorruption();
}

function showHelp() {
    document.getElementById('locationName').textContent = "HELP";
    document.getElementById('description').textContent = 
        "USE MENUS TO MOVE\nEXPLORE EVERYWHERE\nREMEMBER CODES\nBEWARE THE GRUE\nIF ANYTHING BREAKS, SET Z\nTO 0\nPRESS ENTER";
    const menuDiv = document.getElementById('menu');
    menuDiv.innerHTML = '';
    const btn = document.createElement('button');
    btn.className = 'menu-btn';
    btn.textContent = "BACK TO START";
    btn.onclick = () => { showMainMenu(); };
    menuDiv.appendChild(btn);
    const btn2 = document.createElement('button');
    btn2.className = 'menu-btn';
    btn2.textContent = "BEGIN GAME";
    btn2.onclick = () => { startGame(); };
    menuDiv.appendChild(btn2);
    const btn3 = document.createElement('button');
    btn3.className = 'menu-btn';
    btn3.textContent = "QUIT";
    btn3.onclick = () => { showQuit(); };
    menuDiv.appendChild(btn3);
    updateCorruption();
}

function showChangelog() {
    document.getElementById('locationName').textContent = "CHANGELOG";
    document.getElementById('description').textContent = 
        "v1.3.5\n- FIXED SAFE ISSUES\n- EXPANDED THE SCHOOL\n- MORE LORE?\n- FIXED SOME FLASHING";
    const menuDiv = document.getElementById('menu');
    menuDiv.innerHTML = '';
    const btn = document.createElement('button');
    btn.className = 'menu-btn';
    btn.textContent = "BACK TO START";
    btn.onclick = () => { showMainMenu(); };
    menuDiv.appendChild(btn);
    updateCorruption();
}

function showQuit() {
    document.getElementById('locationName').textContent = "THANKS FOR PLAYING!";
    document.getElementById('description').textContent = "SEE YOU NEXT TIME.";
    const menuDiv = document.getElementById('menu');
    menuDiv.innerHTML = '';
    const btn = document.createElement('button');
    btn.className = 'menu-btn';
    btn.textContent = "RESTART";
    btn.onclick = () => { showMainMenu(); };
    menuDiv.appendChild(btn);
    updateCorruption();
}

// ===== INITIALIZE =====
function initGame() {
    const save = loadSave();
    if (save) {
        L2[0] = save.sanity || 0;
        L2[1] = save.deaths || 0;
        Z = save.z || 1;
        F = save.fun || Math.floor(Math.random() * 100) + 1;
        P = save.safeCode || Math.floor(Math.random() * 900) + 100;
        L1 = save.l1 || new Array(25).fill(0);
    } else {
        L1 = new Array(25).fill(0);
        if (Z === 0) {
            L2 = [0, 0];
            Z = 1;
        }
        F = Math.floor(Math.random() * 100) + 1;
        P = Math.floor(Math.random() * 900) + 100;
    }
    currentLocation = "deadEnd";
    render();
}

function startGame() {
    const save = loadSave();
    if (save) {
        L2[0] = save.sanity || 0;
        L2[1] = save.deaths || 0;
        Z = save.z || 1;
        F = save.fun || Math.floor(Math.random() * 100) + 1;
        P = save.safeCode || Math.floor(Math.random() * 900) + 100;
        L1 = save.l1 || new Array(25).fill(0);
    } else {
        L1 = new Array(25).fill(0);
        if (Z === 0) {
            L2 = [0, 0];
            Z = 1;
        }
        F = Math.floor(Math.random() * 100) + 1;
        P = Math.floor(Math.random() * 900) + 100;
    }
    currentLocation = "deadEnd";
    render();
}

// ===== CORRUPTION =====
function updateCorruption() {
    const body = document.body;
    const sanity = L2[0];
    
    body.classList.remove('corrupted', 'corrupted-high');
    
    if (sanity >= 8) {
        body.classList.add('corrupted', 'corrupted-high');
        document.getElementById('locationName').style.textShadow = '0 0 30px rgba(255,0,0,0.3), 0 0 60px rgba(255,0,0,0.1)';
        const screen = document.querySelector('.screen');
        if (screen) screen.style.borderColor = '#3a1a1a';
        body.style.filter = 'brightness(0.85) contrast(1.2)';
    } else if (sanity >= 5) {
        body.classList.add('corrupted');
        document.getElementById('locationName').style.textShadow = '0 0 20px rgba(255,100,0,0.2)';
        const screen = document.querySelector('.screen');
        if (screen) screen.style.borderColor = '#2a2a1a';
        body.style.filter = 'brightness(0.95) contrast(1.1)';
    } else {
        document.getElementById('locationName').style.textShadow = '0 0 20px rgba(58,255,58,0.15)';
        const screen = document.querySelector('.screen');
        if (screen) screen.style.borderColor = '#1a3a1a';
        body.style.filter = 'none';
    }
    
    // Whisper effect at high sanity
    const warning = document.querySelector('.warning');
    if (sanity >= 9 && Math.random() < 0.02) {
        const whispers = ["THE GRUE IS WATCHING", "IT KNOWS", "YOU ARE NOT ALONE", "TURN BACK", "SOMETHING MOVES", "HEAR BREATHING"];
        warning.textContent = whispers[Math.floor(Math.random() * whispers.length)];
        setTimeout(() => {
            warning.textContent = "✦ THE GRUE IS WAITING IN THE DARK ✦";
        }, 2000);
    }
}

// ===== LOCATION DATA =====
const locations = {
    deadEnd: {
        name: "DEAD END",
        desc: function() {
            let baseDesc = "";
            if (L2[1] > 0) {
                if (F === 67) baseDesc = "DEAD END\nYOU ARE AT A DEAD END\n...OR ARE YOU?";
                else baseDesc = "DEAD END\nYOU ARE AT A DEAD END\nOF A DIRT ROAD. THE\nROAD GOES EAST. IN\nTHE DISTANCE YOU CAN\nSEE IT WILL FORK.\nTHE PALMS ARE STILL.\nTOO STILL.";
            } else {
                if (F === 67) baseDesc = "DEAD END\n...OR ARE YOU?";
                else baseDesc = "DEAD END\nYOU ARE AT A DEAD END\nOF A DIRT ROAD. THE\nROAD GOES EAST. IN\nTHE DISTANCE YOU CAN\nSEE IT WILL FORK.\nTALL ROYAL PALMS ARE\nSPACED EQUIDISTANTLY.";
            }
            
            if (L2[0] >= 5 && Math.random() < 0.33) {
                return Str4 + "\n\n" + baseDesc;
            }
            if (L2[0] >= 7 && Math.random() < 0.33) return Str3 + "\n\n" + baseDesc;
            if (L2[0] >= 9) return Str1 + "\n\n" + baseDesc;
            return baseDesc;
        },
        options: function() {
            if (F === 67) return ["EAST", "WEST"];
            return ["EAST"];
        },
        actions: function() {
            if (F === 67) return [() => goTo("dirtRoad"), () => goTo("devRoom")];
            return [() => goTo("dirtRoad")];
        }
    },
    dirtRoad: {
        name: "E/W DIRT ROAD",
        desc: function() {
            let base = "E/W DIRT ROAD\nYOU ARE ON A DIRT\nROAD. TREES LINE\nBOTH SIDES. THE ROAD\nCONTINUES EAST AND\nWEST. THERE IS A\nLARGE BOULDER HERE.\nIT CANNOT BE MOVED.";
            if (L2[0] >= 9) return Str1 + "\n\n" + base;
            if (L2[0] >= 7) return Str3 + "\n\n" + base;
            if (L2[0] >= 5 && Math.random() < 0.33) return Str4 + "\n\n" + base;
            return base;
        },
        options: () => ["EAST", "WEST"],
        actions: () => [() => goTo("fork"), () => goTo("deadEnd")]
    },
    fork: {
        name: "FORK",
        desc: function() {
            let base = "FORK\nYOU ARE AT A FORK.\nPASSAGES LEAD NE AND\nSE. YOU CAN ALSO GO\nBACK WEST.";
            if (L2[0] >= 9) return Str1 + "\n\n" + base;
            if (L2[0] >= 7) return Str3 + "\n\n" + base;
            if (L2[0] >= 5 && Math.random() < 0.33) return Str4 + "\n\n" + base;
            return base;
        },
        options: () => ["SE", "NE", "WEST", "OFFICE"],
        actions: () => [() => goTo("seRoad"), () => goTo("neRoad"), () => goTo("dirtRoad"), () => goTo("officeBuilding")]
    },
    seRoad: {
        name: "SE/NW ROAD",
        desc: function() {
            let base = "SE/NW ROAD\nYOU ARE ON A SE/NW\nROAD. THE PATH WINDS\nTHROUGH DENSE FOREST.\nTHE AIR GROWS COLDER\nAS YOU GO SOUTHEAST.";
            if (L2[0] >= 9) return Str1 + "\n\n" + base;
            if (L2[0] >= 7) return Str3 + "\n\n" + base;
            if (L2[0] >= 5 && Math.random() < 0.33) return Str4 + "\n\n" + base;
            return base;
        },
        options: () => ["SE", "NW"],
        actions: () => [() => goTo("bearHangout"), () => goTo("fork")]
    },
    bearHangout: {
        name: "BEAR HANGOUT",
        desc: function() {
            let base = "";
            if (L1[2] === 0) {
                base = "BEAR HANGOUT\nYOU ARE AT THE END\nOF THE ROAD. A\nPASSAGE LEADS NW.\nA FEROCIOUS BEAR IS\nHERE! HE IS A BEAUTY,\nWITH THICK BROWN FUR\nAND SHARP CLAWS. HE\nWATCHES YOU.";
            } else {
                base = "BEAR HANGOUT\nTHE BEAR IS GONE.\nTHE AREA IS PEACEFUL.\nA PASSAGE LEADS NW.\nA FAINT PATH GOES SE.";
                if (L2[1] > 0 && L1[2] === 1) {
                    base += "\nTHE BEAR NODS.\nIT REMEMBERS YOU.";
                }
                if (F > 80 && Math.random() < 0.1) {
                    L2[0] = Math.min(10, L2[0] + 1);
                    base += "\nTHE BEAR WHISPERS:\n'...FUNNY NUMBER...'";
                }
            }
            if (L2[0] >= 9) return Str1 + "\n\n" + base;
            if (L2[0] >= 7) return Str3 + "\n\n" + base;
            if (L2[0] >= 5 && Math.random() < 0.33) return Str4 + "\n\n" + base;
            return base;
        },
        options: function() {
            if (L1[2] === 0) return ["SE", "NW", "FEED BEAR"];
            return ["SE", "NW"];
        },
        actions: function() {
            if (L1[2] === 0) {
                return [() => bearDeathAnnoyed(), () => bearDeathChase(), () => feedBear()];
            } else {
                return [() => goTo("clearing"), () => goTo("seRoad")];
            }
        }
    },
    neRoad: {
        name: "NE/SW ROAD",
        desc: function() {
            let base = "NE/SW ROAD\nYOU ARE ON A NE/SW\nROAD. THE PATH IS\nWELL-WORN, SUGGESTING\nTRAVELERS PASS OFTEN.";
            if (L2[0] >= 9) return Str1 + "\n\n" + base;
            if (L2[0] >= 7) return Str3 + "\n\n" + base;
            if (L2[0] >= 5 && Math.random() < 0.33) return Str4 + "\n\n" + base;
            return base;
        },
        options: () => ["NE", "SW"],
        actions: () => [() => goTo("building"), () => goTo("fork")]
    },
    building: {
        name: "BUILDING ENTRANCE",
        desc: function() {
            let base = "";
            if (L1[1] === 0) {
                base = "BUILDING ENTRANCE\nYOU ARE AT THE END\nOF THE ROAD. A STURDY\nWOODEN BUILDING\nSTANDS TO THE NE.\nTHE DOOR IS LOCKED.\nYOU NEED A KEY.";
            } else {

// ===== TYPING EFFECT =====
function typeText(text, callback) {
    if (typingInterval) {
        clearInterval(typingInterval);
        typingInterval = null;
    }
    const descEl = document.getElementById('description');
    let index = 0;
    descEl.textContent = '';
    
    const sanity = L2[0];
    let speed = 15;
    if (sanity >= 8) speed = 6;
    else if (sanity >= 6) speed = 10;
    
    // Save for ghost text
    previousDescription = text;
    document.getElementById('ghostText').textContent = text;
    
    typingInterval = setInterval(() => {
        if (index < text.length) {
            let char = text.charAt(index);
            
            // Text decay - random symbols at high sanity
            if (sanity >= 7 && Math.random() < 0.04) {
                char = String.fromCharCode(33 + Math.random() * 94);
            }
            // Skip character (text vanishes)
            if (sanity >= 9 && Math.random() < 0.02) {
                index++;
                if (index < text.length) {
                    char = text.charAt(index);
                }
            }
            descEl.textContent += char;
            index++;
        } else {
            clearInterval(typingInterval);
            typingInterval = null;
            if (callback) callback();
        }
    }, speed);
}

function setMenuHidden() {
    const menuDiv = document.getElementById('menu');
    menuDiv.classList.remove('visible');
    menuDiv.classList.add('hidden');
}

function setMenuVisible() {
    const menuDiv = document.getElementById('menu');
    menuDiv.classList.remove('hidden');
    menuDiv.classList.add('visible');
}

// ===== HELPER FUNCTIONS =====
function goTo(location) {
    currentLocation = location;
    render();
}

function showMessage(msg, nextLocation = null) {
    if (typingInterval) {
        clearInterval(typingInterval);
        typingInterval = null;
    }
    pendingLocation = nextLocation;
    const menuDiv = document.getElementById('menu');
    document.getElementById('locationName').textContent = "";
    document.getElementById('description').textContent = msg;
    setMenuHidden();
    
    if (nextLocation === null) {
        // Death or message with no next location - go to main menu
        menuDiv.innerHTML = '<button class="menu-btn" onclick="goToMainMenuAfterDeath()">CONTINUE</button>';
    } else {
        menuDiv.innerHTML = '<button class="menu-btn" onclick="continueGame()">CONTINUE</button>';
    }
    
    requestAnimationFrame(() => {
        setMenuVisible();
        updateCorruption();
    });
}

function goToMainMenuAfterDeath() {
    L1 = new Array(25).fill(0);
    Z = 1;
    F = Math.floor(Math.random() * 100) + 1;
    P = Math.floor(Math.random() * 900) + 100;
    currentLocation = "mainMenu";
    saveGame();
    render();
}

function continueGame() {
    if (pendingLocation) {
        const next = pendingLocation;
        pendingLocation = null;
        goTo(next);
    } else {
        render();
    }
}

function render() {
    if (currentLocation === "mainMenu") {
        showMainMenu();
        return;
    }
    const loc = locations[currentLocation];
    if (!loc) {
        document.getElementById('locationName').textContent = "ERROR";
        document.getElementById('description').textContent = "Location not found: " + currentLocation;
        return;
    }
    
    document.getElementById('locationName').textContent = loc.name;
    let descText = typeof loc.desc === 'function' ? loc.desc() : loc.desc;
    
    // Apply glitch word replacement
    descText = applyGlitchWords(descText);
    
    // Clear any existing typing interval
    if (typingInterval) {
        clearInterval(typingInterval);
        typingInterval = null;
    }
    
    const menuDiv = document.getElementById('menu');
    menuDiv.innerHTML = '';
    setMenuHidden();
    
    const opts = typeof loc.options === 'function' ? loc.options() : loc.options;
    const acts = typeof loc.actions === 'function' ? loc.actions() : loc.actions;
    
    for (let i = 0; i < opts.length; i++) {
        const btn = document.createElement('button');
        btn.className = 'menu-btn';
        btn.textContent = opts[i];
        btn.onclick = acts[i];
        menuDiv.appendChild(btn);
    }
    
    // Type the description, then fade in the buttons
    typeText(descText, () => {
        setMenuVisible();
    });
    
    // Update corruption
    updateCorruption();
}

    if (l === 5) {
        showMessage("THE ELEVATOR CABLES\nSNAP! YOU PLUMMET\nDOWN THE SHAFT.\nYOU LAND WITH A\nTERRIBLE CRUNCH.");
        L2[1]++;
        saveGame();
    } else {
        showMessage("THE ELEVATOR DOORS\nOPEN. INSIDE,\nA BEAR IN A SUIT.\n'GOING DOWN?'", locs[l-1]);
    }
}

function checkVents() {
    showMessage("YOU OPEN THE VENT.\nEYES GLOW INSIDE.\nA GRUE POUNCES!\n'FINALLY, DELIVERY!'\nIT CHOMPS HAPPILY.");
    L2[1]++;
    saveGame();
}

function spinWheel() {
    if (L1[9] === 1) {
        showMessage("THE SPINNER IS SILENT.\nIT HAS ALREADY BEEN USED.", "clearing");
        return;
    }
    L1[9] = 1;
    let dest = Math.floor(Math.random() * 10) + 1;
    let locs = ["deadEnd", "dirtRoad", "fork", "seRoad", "bearHangout", "neRoad", "building", "storage", "clearing", "darkRoom"];
    showMessage("THE ARROW SPINS...\n...AND LANDS ON:\n" + locs[dest-1].toUpperCase() + "\n\nYOU FEEL PULLED...", locs[dest-1]);
}

function resetGame() {
    L1 = new Array(25).fill(0);
    Z = 1;
    F = Math.floor(Math.random() * 100) + 1;
    P = Math.floor(Math.random() * 900) + 100;
    currentLocation = "mainMenu";
    saveGame();
    render();
}
